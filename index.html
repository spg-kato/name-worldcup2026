// build team dropdown
const teamSel=document.getElementById("teamSel");
teamSel.innerHTML='<option value="all">全チーム</option>'+knownTeams.map(t=>`<option value="${t}">${F[t]||""} ${t}</option>`).join("");

const state={team:"all",stage:"all",group:"all",free:false,dazn:false,upcoming:false,fav:null};

function chip(id,key){const el=document.getElementById(id);el.addEventListener("click",()=>{
  state[key]=!state[key];el.setAttribute("aria-pressed",state[key]);
  render();
});}
chip("upcomingChip","upcoming");
// quick team chips (日本 / アルゼンチン) — only one active, synced with dropdown
const QUICK=[["jpnChip","日本"],["argChip","アルゼンチン"]];
function syncQuick(){QUICK.forEach(([id,name])=>document.getElementById(id).setAttribute("aria-pressed",state.fav===name));}
QUICK.forEach(([id,name])=>{document.getElementById(id).addEventListener("click",()=>{
  if(state.fav===name){state.fav=null;state.team="all";teamSel.value="all";}
  else{state.fav=name;state.team=name;teamSel.value=name;}
  syncQuick();render();
});});
// free / dazn are mutually exclusive
function exclusiveChip(id,key,other){const el=document.getElementById(id);el.addEventListener("click",()=>{
  state[key]=!state[key];el.setAttribute("aria-pressed",state[key]);
  if(state[key]){state[other]=false;document.getElementById(other==="free"?"freeChip":"daznChip").setAttribute("aria-pressed",false);}
  render();
});}
exclusiveChip("freeChip","free","dazn");
exclusiveChip("daznChip","dazn","free");
teamSel.addEventListener("change",e=>{state.team=e.target.value;state.fav=QUICK.some(q=>q[1]===e.target.value)?e.target.value:null;syncQuick();render();});
document.getElementById("stageSel").addEventListener("change",e=>{state.stage=e.target.value;render();});
document.getElementById("groupSel").addEventListener("change",e=>{state.group=e.target.value;render();});

// reset all filters to default
document.getElementById("resetChip").addEventListener("click",()=>{
  Object.assign(state,{team:"all",stage:"all",group:"all",free:false,dazn:false,upcoming:false,fav:null});
  teamSel.value="all";
  document.getElementById("stageSel").value="all";
  document.getElementById("groupSel").value="all";
  document.getElementById("freeChip").setAttribute("aria-pressed",false);
  document.getElementById("daznChip").setAttribute("aria-pressed",false);
  document.getElementById("upcomingChip").setAttribute("aria-pressed",false);
  syncQuick();
  render();
});

function teamCell(name){
  const flag=F[name]?`<span class="flag">${F[name]}</span>`:"";
  const url=squadUrl(name);
  if(url)return `<a class="team-link" href="${url}" target="_blank" rel="noopener">${flag}${name}</a>`;
  if(F[name])return `${flag}${name}`;
  return `<span class="tbd">${name}</span>`;
}

  // r.t1/r.t2 は openfootball の team1/team2 を日本語化したもの
  if(r.t1===m.a){return {h:r.g1,a:r.g2,pk:r.pk?{h:r.pk1,a:r.pk2}:null};}
  return {h:r.g2,a:r.g1,pk:r.pk?{h:r.pk2,a:r.pk1}:null};
}

function setStatus(t){document.getElementById("scoreStatus").textContent=t;}

async function fetchScores(){
  setStatus("スコア: 読み込み中…");
  const url="https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json";
  try{
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    const map={};
    let n=0;
    for(const mt of (data.matches||[])){
      const jp1=EN2JP[norm(mt.team1)], jp2=EN2JP[norm(mt.team2)];
      if(!jp1||!jp2)continue;                 // 未解決（プレーオフ仮名など）はスキップ
      const ft=mt.score&&mt.score.ft;
      if(!ft||ft.length<2)continue;           // スコア未確定はスキップ
      const rec={t1:jp1,t2:jp2,g1:ft[0],g2:ft[1]};
      if(mt.score.p&&mt.score.p.length>=2){rec.pk=true;rec.pk1=mt.score.p[0];rec.pk2=mt.score.p[1];}
      map[pairKey(jp1,jp2)]=rec; n++;
    }
    SCORES=map;
    const now=new Date();
    setStatus(`スコア: ${n}試合反映済み（更新 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}）／ 出典 openfootball・反映に遅れあり`);
    render();
    renderStandings();
  }catch(e){
    setStatus("スコア: 取得できず（日程は通常どおり表示）");
  }
}

// ---- 順位表（グループリーグのみ・簡易版） ----
// 並び順: 勝点 → 得失点差 → 総得点（直接対決は未考慮）
function buildStandings(){
  const groups={}; // "A" -> {teams:Set, table:{name:{...}}}
  for(const m of M){
    if(m.s!=="gl")continue;
    const gm=m.g.match(/^([A-L])組/);
    if(!gm)continue;
    const gKey=gm[1];
    groups[gKey]=groups[gKey]||{};
    for(const t of [m.a,m.b]){
      if(!groups[gKey][t])groups[gKey][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    }
    const sc=getScore(m);
    if(!sc)continue; // 未消化の試合はカウントしない
    const home=groups[gKey][m.a], away=groups[gKey][m.b];
    home.p++; away.p++;
    home.gf+=sc.h; home.ga+=sc.a;
    away.gf+=sc.a; away.ga+=sc.h;
    if(sc.h>sc.a){home.w++;home.pts+=3;away.l++;}
    else if(sc.h<sc.a){away.w++;away.pts+=3;home.l++;}
    else{home.d++;away.d++;home.pts++;away.pts++;}
  }
  const result={};
  for(const gKey in groups){
    const rows=Object.values(groups[gKey]);
    rows.sort((a,b)=> b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf || a.name.localeCompare(b.name,"ja"));
    result[gKey]=rows;
  }
  // 各チームの「次の未消化試合」の相手を求める
  for(const m of M){
    if(m.s!=="gl")continue;
    const gm=m.g.match(/^([A-L])組/);
    if(!gm)continue;
    if(getScore(m))continue; // 消化済みは飛ばす
    const rows=result[gm[1]];
    if(!rows)continue;
    for(const[self,opp] of [[m.a,m.b],[m.b,m.a]]){
      const row=rows.find(r=>r.name===self);
      if(row&&!row.next){row.next=opp;row.nextDate=m.d+" "+m.t;}
    }
  }
  return result;
}

function renderStandings(){
  const el=document.getElementById("standingsApp");
  const data=buildStandings();
  const groupKeys=Object.keys(data).sort();
  if(!groupKeys.length){el.innerHTML='<div class="empty">グループデータがまだないわ。</div>';return;}
  let html='<div class="std-wrap">';
  for(const gKey of groupKeys){
    const rows=data[gKey];
    html+=`<div class="std-group"><div class="std-head">${gKey}組</div>
      <table class="std-tbl"><thead><tr>
        <th class="team-col">チーム</th><th>試</th><th>勝</th><th>分</th><th>負</th><th>得失</th><th>勝点</th><th>次</th>
      </tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const gd=r.gf-r.ga;
      const gdStr=gd>0?`+${gd}`:`${gd}`;
      const nextCell=r.next?`<span class="next-flag" title="次戦: ${r.next}">${F[r.next]||"–"}</span>`:`<span class="next-done" title="グループL終了">✓</span>`;
      html+=`<tr class="${i<2?"adv":""}">
        <td class="team-col" data-team="${r.name}">${F[r.name]||""} ${r.name}<span class="tap">▶</span></td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td>${gdStr}<small>(${r.gf}-${r.ga})</small></td><td class="pts">${r.pts}</td>
        <td class="next-col">${nextCell}</td>
      </tr>`;
    });
    html+=`</tbody></table><div class="std-legend">緑＝決勝T進出圏内（1〜2位。3位通過は12組の成績比較で別途確定）</div></div>`;
  }
  html+='</div>';
  el.innerHTML=html;
  el.querySelectorAll('td.team-col[data-team]').forEach(td=>{
    td.addEventListener('click',()=>openTeamModal(td.getAttribute('data-team')));
  });
}

// チームの全試合（結果＋予定）をモーダル表示
function openTeamModal(team){
  const list=M.filter(m=>m.a===team||m.b===team)
    .slice().sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
  const dow=["日","月","火","水","木","金","土"];
  let html="";
  for(const m of list){
    const sc=getScore(m);
    const opp=m.a===team?m.b:m.a;
    const dt=new Date(m.d+"T00:00:00");
    const dateStr=`${m.d.slice(5).replace("-","/")}(${dow[dt.getDay()]}) ${m.t}`;
    const stageStr=m.g||(m.s==="gl"?"グループL":"決勝T");
    let scoreHtml;
    if(sc){
      // sc.h=home(m.a) 視点。team視点に変換
      const my=m.a===team?sc.h:sc.a, ot=m.a===team?sc.a:sc.h;
      const mark=my>ot?'<span style="color:var(--pitch);font-weight:800">○</span>':my<ot?'<span style="color:#C0392B;font-weight:800">●</span>':'<span style="color:var(--muted);font-weight:800">△</span>';
      scoreHtml=`<span class="tm-score">${my} - ${ot}</span> ${mark}`;
    }else{
      scoreHtml=`<span class="tm-soon">${m.t} 予定</span>`;
    }
    const snUrl=snGameUrl(m);
    const oppCell=`${F[opp]||""} ${opp}`;
    html+=`<div class="tm-match is-self">
      <div class="tm-meta">${dateStr}・${stageStr}${m.v?"・"+m.v:""}</div>
      <div class="tm-row">
        <span class="tm-vs">vs ${oppCell}</span>
        ${snUrl?`<a href="${snUrl}" target="_blank" rel="noopener" style="text-decoration:none">${scoreHtml}</a>`:scoreHtml}
      </div>
    </div>`;
  }
  document.getElementById("tmTitle").innerHTML=`${F[team]||""} ${team} の試合`;
  document.getElementById("tmBody").innerHTML=html;
  document.getElementById("teamModal").style.display="flex";
}
function closeTeamModal(){document.getElementById("teamModal").style.display="none";}

function squadUrl(name){
  const id=SQUAD[name];
  return id?`${BASE_SN}${id}/directory?gk=18`:null;
}
function renderSquadLink(){
  const el=document.getElementById("squadLink");
  const t=state.team;
  const url=t!=="all"?squadUrl(t):null;
  el.innerHTML=url?`<a href="${url}" target="_blank" rel="noopener">${F[t]||""} ${t}のメンバー（スポーツナビ）↗</a>`:"";
}

function render(){
  renderSquadLink();
  let rows=M.filter(m=>{
    if(state.team!=="all" && m.a!==state.team && m.b!==state.team)return false;
    if(state.stage!=="all" && m.s!==state.stage)return false;
    if(state.group!=="all" && !m.g.startsWith(state.group+"組"))return false;
    if(state.free && !m.tv)return false;
    if(state.dazn && m.tv)return false;
    if(state.upcoming && m.d<TODAY)return false;
    return true;
  });
  document.getElementById("count").innerHTML=
    `全${rows.length}試合 ／ <span style="color:var(--gold);font-weight:800">無料${rows.filter(m=>m.tv).length}</span>`+
    ` ／ <span style="color:var(--ink);font-weight:800">DAZN専用${rows.filter(m=>!m.tv).length}</span>`;
  const app=document.getElementById("app");
  if(!rows.length){app.innerHTML='<div class="empty">条件に合う試合がないわ。<br>フィルタを緩めてみて。</div>';return;}
  // group by date
  let html="",lastDay="",open=false;
  for(const m of rows){
    if(m.d!==lastDay){
      if(open){html+="</div>";}            // close previous day's list
      lastDay=m.d;open=true;
      const [Y,Mo,Da]=m.d.split("-").map(Number);
      const dow=DOW[new Date(Y,Mo-1,Da).getDay()];
      const isToday=m.d===TODAY;
      html+=`<div class="day${isToday?" today":""}">${Mo}月${Da}日<span class="dow">(${dow})</span>${isToday?'<span class="badge-today">今日</span>':''}</div><div class="list">`;
    }
    const isArg=state.fav&&(m.a===state.fav||m.b===state.fav);
    const tvBadge=m.tv?`<span class="badge b-free">${m.tv} 無料</span>`:"";
    const sc=getScore(m);
    const snUrl=snGameUrl(m);
    let scoreHtml="",ftBadge="";
    if(sc){
      const pk=sc.pk?`<span class="pk">PK ${sc.pk.h}-${sc.pk.a}</span>`:"";
      if(snUrl){
        scoreHtml=`<a class="score-link" href="${snUrl}" target="_blank" rel="noopener" title="長押しで試合詳細へ">${sc.h} - ${sc.a}${pk}</a>`;
      }else{
        scoreHtml=`<span class="score">${sc.h} - ${sc.a}${pk}</span>`;
      }
      ftBadge='<span class="badge b-ft">終了</span>';
    }else if(snUrl){
      // スコア未確定でもURLがあれば「詳細」リンクを出す
      scoreHtml=`<a class="score-link preview" href="${snUrl}" target="_blank" rel="noopener">詳細↗</a>`;
    }
    html+=`<div class="match${m.tv?" free":""}${sc?" done":""}">
      <div class="time">${m.t}<small>${m.v}</small></div>
      <div class="info">
        <div class="stage">${isArg?'<span class="arg">★ </span>':''}${m.g}</div>
        <div class="teams">${teamCell(m.a)}<span class="vs">vs</span>${teamCell(m.b)}${scoreHtml}</div>
        <div class="meta">${ftBadge}${tvBadge}<span class="badge b-dazn">DAZN</span></div>
      </div></div>`;
  }
  if(open){html+="</div>";}                 // close final day's list
  app.innerHTML=html;
}
