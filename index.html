<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-title" content="W杯2026">
<style>
  :root{
    --ink:#0B1F3A;--paper:#FBFCFE;--card:#FFFFFF;--line:#E4E9F2;
    --pitch:#00A85A;--pitch-dk:#007a41;--gold:#F5A300;--gold-bg:#FFF6E0;
    --dazn:#111418;--muted:#6B7A90;--jp:#E5283C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;padding-bottom:48px}
  header{background:linear-gradient(110deg,var(--ink) 0%,#13315e 60%,var(--pitch-dk) 130%);color:#fff;padding:18px 16px 16px}
  .eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;color:#7fe3b0;text-transform:uppercase}
  h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
  .sub{font-size:12px;color:#aebfd6;margin-top:4px}
  /* tabs */
  .viewtabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
  .vtab{flex:1;font-size:12px;font-weight:800;padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .vtab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* KO controls */
  .controls{position:sticky;top:54px;z-index:19;background:rgba(251,252,254,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;user-select:none;transition:.12s}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.gold[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#3a2a00}
  .chip.jp[aria-pressed="true"]{background:var(--jp);border-color:var(--jp);color:#fff}
  .chip.reset{background:#EEF2F8;border-color:#D6DEEA;color:var(--ink)}
  .count{font-size:12px;color:var(--muted);padding:2px 0 0;flex-basis:100%}
  /* schedule */
  .day{background:var(--paper);font-size:13px;font-weight:800;letter-spacing:.02em;padding:14px 16px 6px;color:var(--ink);border-bottom:1px solid var(--line)}
  .day .dow{color:var(--muted);font-weight:700;margin-left:6px;font-size:12px}
  .day.today{color:var(--pitch-dk)}
  .day .badge-today{background:var(--pitch);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:8px;vertical-align:1px}
  .list{padding:8px 12px 0}
  .match{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
  .match.free{border-left:4px solid var(--gold);background:var(--gold-bg)}
  .match.hl-jp{border-left:4px solid var(--jp);background:#FFF5F5}
  .match.hl-arg{border-left:4px solid var(--gold);background:var(--gold-bg)}
  .match.hl-star{border-left:4px solid var(--pitch)}
  .match.done{opacity:.72}
  .match.done .time{color:var(--muted)}
  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1;text-align:center}
  .time small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:5px;letter-spacing:.04em}
  .info{min-width:0}
  .stage{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
  .teams{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .teams .vs{color:var(--muted);font-size:12px;font-weight:800;margin:0 2px}
  .flag{font-size:17px}
  .tbd{color:var(--muted);font-weight:600}
  .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
  .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.02em}
  .b-free{background:var(--gold);color:#3a2a00}
  .b-dazn{background:var(--dazn);color:#fff}
  .b-ft{background:#3a4a63;color:#fff}

function getScore(m){
  const r=SCORES[pairKey(m.a,m.b)];
  if(!r)return null;
  if(r.t1===m.a)return{h:r.g1,a:r.g2,pk:r.pk?{h:r.pk1,a:r.pk2}:null};
  return{h:r.g2,a:r.g1,pk:r.pk?{h:r.pk2,a:r.pk1}:null};
}

async function fetchScores(){
  setStatus("スコア: 読み込み中…");
  try{
    const res=await fetch("https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json",{cache:"no-store"});
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    const map={};let n=0;
    for(const mt of(data.matches||[])){
      const jp1=EN2JP[norm(mt.team1)],jp2=EN2JP[norm(mt.team2)];
      if(!jp1||!jp2)continue;
      const ft=mt.score&&mt.score.ft;
      if(!ft||ft.length<2)continue;
      const rec={t1:jp1,t2:jp2,g1:ft[0],g2:ft[1]};
      if(mt.score.p&&mt.score.p.length>=2){rec.pk=true;rec.pk1=mt.score.p[0];rec.pk2=mt.score.p[1];}
      map[pairKey(jp1,jp2)]=rec;n++;
    }
    SCORES=map;
    const now=new Date();
    setStatus(`スコア: ${n}試合反映済み（${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}更新）/ openfootball・反映に遅れあり`);
    if(currentTab==="bracket")renderBracket();
    else if(currentTab==="schedule")renderKOSchedule();
    else if(currentTab==="gl")renderGLResults();
  }catch(e){
    setStatus("スコア: 取得できず（日程は表示）");
  }
}

function getKOWinner(m){
  if(!F[m.a]||!F[m.b])return null;
  const sc=getScore(m);
  if(!sc)return null;
  if(sc.h>sc.a)return m.a;
  if(sc.h<sc.a)return m.b;
  if(sc.pk)return sc.pk.h>sc.pk.a?m.a:m.b;
  return null;
}

function buildBracket(){
  const sl={};
  for(const m of M)if(m.slot)sl[m.slot]={...m};
  let changed=true;
  while(changed){
    changed=false;
    for(const[src,[dst,p]] of Object.entries(BFLOW)){
      if(!sl[src]||!sl[dst])continue;
      const w=getKOWinner(sl[src]);
      if(w&&sl[dst][p]!==w){sl[dst][p]=w;changed=true;}
    }
    for(const[sf,[dst,p]] of Object.entries(BFLOW3)){
      const s=sl[sf];
      if(!s||!sl[dst]||!F[s.a]||!F[s.b])continue;
      const sc=getScore(s);if(!sc)continue;
      const l=sc.h>sc.a?s.b:sc.h<sc.a?s.a:(sc.pk&&sc.pk.h>sc.pk.a?s.b:s.a);
      if(l&&sl[dst][p]!==l){sl[dst][p]=l;changed=true;}
    }
  }
  return sl;
}

function renderBracket(){
  const sl=buildBracket();
  // 親試合の国旗をTBD表示に使うための逆引きマップ
  const BFREV={};
  for(const[src,[dst,pos]] of Object.entries(BFLOW)){
    if(!BFREV[dst])BFREV[dst]={};
    BFREV[dst][pos]=src;
  }
  function teamLabel(name,sid,pos){
    if(F[name])return`${F[name]}<b>${name}</b>`;
    // TBD → 親試合の国旗ペアを表示
    const pid=BFREV[sid]&&BFREV[sid][pos];
    const pm=pid&&sl[pid];
    if(pm&&F[pm.a]&&F[pm.b])return`<span class="bk-tbd">${SLOT_LABEL[pid]||''} ${F[pm.a]}×${F[pm.b]} の勝者</span>`;

function renderKOSchedule(){
  const bk=buildBracket();

    if(!m.slot||!bk[m.slot])return m;

  });
  if(koState.free)rows=rows.filter(m=>m.tv);
  if(koState.upcoming)rows=rows.filter(m=>m.d>=TODAY);
  if(koState.fav)rows=rows.filter(m=>m.a===koState.fav||m.b===koState.fav);
  document.getElementById("count").textContent=`全${rows.length}試合 / 無料${rows.filter(m=>m.tv).length}`;
  const app=document.getElementById("koScheduleApp");
  if(!rows.length){app.innerHTML='<div class="empty">条件に合う試合なし</div>';return;}
  let html="",lastDay="",open=false;
  for(const m of rows){
    if(m.d!==lastDay){
      if(open)html+="</div>";
      lastDay=m.d;open=true;
      const[Y,Mo,Da]=m.d.split("-").map(Number);
      const dow=DOW[new Date(Y,Mo-1,Da).getDay()];

      html+=`<div class="day${isToday?" today":""}">${Mo}月${Da}日<span class="dow">(${dow})</span>${isToday?'<span class="badge-today">今日</span>':""}</div><div class="list">`;

      const pk=sc.pk?`<span class="pk">PK ${sc.pk.h}-${sc.pk.a}</span>`:"";
      scoreHtml=snUrl
        ?`<a class="score-link" href="${snUrl}" target="_blank" rel="noopener">${sc.h} - ${sc.a}${pk}</a>`
        :`<span class="score">${sc.h} - ${sc.a}${pk}</span>`;

    }else if(snUrl){
      scoreHtml=`<a class="score-link preview" href="${snUrl}" target="_blank" rel="noopener">詳細↗</a>`;

  }
  if(open)html+="</div>";

}

// ---- GL Results (standings, no 次 column) ----
function buildStandings(){
  const groups={};
  for(const m of M){
    if(m.s!=="gl")continue;
    const gm=m.g.match(/^([A-L])組/);if(!gm)continue;
    const gKey=gm[1];
    groups[gKey]=groups[gKey]||{};
    for(const t of[m.a,m.b]){if(!groups[gKey][t])groups[gKey][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};}
    const sc=getScore(m);if(!sc)continue;
    const home=groups[gKey][m.a],away=groups[gKey][m.b];
    home.p++;away.p++;home.gf+=sc.h;home.ga+=sc.a;away.gf+=sc.a;away.ga+=sc.h;
    if(sc.h>sc.a){home.w++;home.pts+=3;away.l++;}
    else if(sc.h<sc.a){away.w++;away.pts+=3;home.l++;}
    else{home.d++;away.d++;home.pts++;away.pts++;}
  }
  const result={};
  for(const gKey in groups){
    const rows=Object.values(groups[gKey]);
    rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name,"ja"));
    result[gKey]=rows;
  }
  return result;
}

  for(const gKey of groupKeys){

    html+=`<div class="std-group"><div class="std-head">${gKey}組</div>
      <table class="std-tbl"><thead><tr>

    rows.forEach((r,i)=>{

    });

}

function showBracket(){
  const sl=buildBracket();
  const W=1100,H=680,RH=H/16,CX=W/2;
  const ABB={'ボスニア・ヘルツェゴビナ':'ボスニア','コンゴ民主共和国':'DRコンゴ','コートジボワール':'コートジ','カーボベルデ':'CPV'};
  const ts=n=>!n?'-':(F[n]||'')+(ABB[n]||n);
  const fc=n=>['日本','アルゼンチン'].includes(n)?'#FFD700':'#fff';
  const ry=(mi,ti)=>(mi*2+ti)*RH+RH*.5;
  const ym=mi=>(ry(mi,0)+ry(mi,1))*.5;
  const r16y=ri=>(ym(ri*2)+ym(ri*2+1))*.5;
  const qfy=qi=>(r16y(qi*2)+r16y(qi*2+1))*.5;
  const sfY=(qfy(0)+qfy(1))*.5;
  const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${+y1.toFixed(1)}" x2="${x2}" y2="${+y2.toFixed(1)}" stroke="#2a4a7a" stroke-width="1.5"/>`;
  const tx=(x,y,t,a,fill,fs)=>`<text x="${x}" y="${+y.toFixed(1)}" fill="${fill||'#fff'}" font-size="${fs||12}" text-anchor="${a||'start'}" dominant-baseline="middle">${t}</text>`;
  const LS=['r32_3','r32_6','r32_1','r32_4','r32_12','r32_11','r32_10','r32_9'];
  const RS=['r32_2','r32_5','r32_7','r32_8','r32_15','r32_14','r32_13','r32_16'];
  const LR16=['r16_b','r16_a','r16_e','r16_f'],RR16=['r16_c','r16_d','r16_g','r16_h'];
  const LQF=['qf_1','qf_2'],RQF=['qf_3','qf_4'];
  // x座標
  const L0=178,L1=180,L2=197,L3=202,L4=338,L5=341,L6=348,L7=435,L8=440,L9=447,L10=495,L11=500,L12=CX-18;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="background:#0B1F3A;font-family:-apple-system,sans-serif">`;
  // ラウンドラベル
  ['R32','R16','QF','SF'].forEach((lb,i)=>{
    const xs=[5,208,352,449];
    s+=tx(xs[i],10,lb,'start','#3a6090',10);
    s+=tx(W-xs[i],10,lb,'end','#3a6090',10);
  });
  // 左R32
  LS.forEach((sid,mi)=>{
    const m=sl[sid];if(!m)return;
    [m.a,m.b].forEach((n,ti)=>{const y=ry(mi,ti);s+=tx(L0,y,ts(n),'end',fc(n),12);s+=ln(L1,y,L2,y);});
    const yc=ym(mi);s+=ln(L2,ry(mi,0),L2,ry(mi,1));s+=ln(L2,yc,L3,yc);
  });
  // 右R32
  RS.forEach((sid,mi)=>{
    const m=sl[sid];if(!m)return;
    [m.a,m.b].forEach((n,ti)=>{const y=ry(mi,ti);s+=tx(W-L0,y,ts(n),'start',fc(n),12);s+=ln(W-L1,y,W-L2,y);});
    const yc=ym(mi);s+=ln(W-L2,ry(mi,0),W-L2,ry(mi,1));s+=ln(W-L2,yc,W-L3,yc);
  });
  // 左R16
  LR16.forEach((sid,ri)=>{
    const m=sl[sid],y=r16y(ri);
    if(m&&F[m.a])s+=tx(L4,y,ts(m.a),'end','#80b0e0',11);
    s+=ln(L3,y,L4,y);s+=ln(L5,y,L6,y);
  });
  for(let q=0;q<2;q++){const ya=r16y(q*2),yb=r16y(q*2+1),yq=qfy(q);s+=ln(L6,ya,L6,yb);s+=ln(L6,yq,L7,yq);}
  // 右R16
  RR16.forEach((sid,ri)=>{
    const m=sl[sid],y=r16y(ri);
    if(m&&F[m.a])s+=tx(W-L4,y,ts(m.a),'start','#80b0e0',11);
    s+=ln(W-L3,y,W-L4,y);s+=ln(W-L5,y,W-L6,y);
  });
  for(let q=0;q<2;q++){const ya=r16y(q*2),yb=r16y(q*2+1),yq=qfy(q);s+=ln(W-L6,ya,W-L6,yb);s+=ln(W-L6,yq,W-L7,yq);}
  // 左QF
  LQF.forEach((sid,qi)=>{
    const m=sl[sid],y=qfy(qi);
    if(m&&F[m.a])s+=tx(L7,y,ts(m.a),'end','#60a0d0',11);
    s+=ln(L8,y,L9,y);
  });
  s+=ln(L9,qfy(0),L9,qfy(1));s+=ln(L9,sfY,L10,sfY);
  // 右QF
  RQF.forEach((sid,qi)=>{
    const m=sl[sid],y=qfy(qi);
    if(m&&F[m.a])s+=tx(W-L7,y,ts(m.a),'start','#60a0d0',11);
    s+=ln(W-L8,y,W-L9,y);
  });
  s+=ln(W-L9,qfy(0),W-L9,qfy(1));s+=ln(W-L9,sfY,W-L10,sfY);
  // SF→決勝
  const sf1=sl.sf_1,sf2=sl.sf_2,fin=sl.final;
  if(sf1&&F[sf1.a])s+=tx(L10,sfY,ts(sf1.a),'end','#4090c0',11);
  if(sf2&&F[sf2.a])s+=tx(W-L10,sfY,ts(sf2.a),'start','#4090c0',11);
  s+=ln(L11,sfY,L12,sfY);s+=ln(W-L11,sfY,W-L12,sfY);
  // 決勝
  s+=`<text x="${CX}" y="${sfY-22}" fill="#FFD700" font-size="16" font-weight="800" text-anchor="middle">🏆</text>`;
  s+=`<text x="${CX}" y="${sfY+2}" fill="#FFD700" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle">${fin&&F[fin.a]?ts(fin.a):'?'}</text>`;
  s+=`<text x="${CX}" y="${sfY+18}" fill="#888" font-size="10" text-anchor="middle">vs</text>`;
  s+=`<text x="${CX}" y="${sfY+34}" fill="#FFD700" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle">${fin&&F[fin.b]?ts(fin.b):'?'}</text>`;
  s+='</svg>';
  document.getElementById('bkSVG').innerHTML=s;
  document.getElementById('bkModal').style.display='block';
  document.body.style.overflow='hidden';
}
